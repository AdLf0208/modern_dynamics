[mod]
id = "moderndynamics"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The content half is inside this bundle (`data/moderndynamics-content.hmod`, the
# built `content/moderndynamics.hmod`): this writes it to `.horizon-cache/` and
# appends it to the dev-mod list, so one `.hnmod` installs the pipe, the
# extractor and the code. The registry keeps one file per project, so a split
# port could not be listed; AE2 ships the same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# The pure item-pipe logic (standalone crate lib, injected as
# `crate::game::moderndynamics`): connections, the extractor mask, the
# 40-tick/4-item operation, network distance and the destination order.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "moderndynamics"
source = "runtime.rs"
# Game-side glue: the pipe's block entity, its connection state and the
# extractor operations, plus `/moderndynamics info`.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "moderndynamics_state"
source = "support.rs"

# A placed item pipe gets a block entity (its attachments are saved there, as
# upstream's node data is).
[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "entity" },
]

# After the level's tick: recompute each pipe's connections from its
# neighbours and let every extractor move its batch.
[[injection]]
id = "level-tick-post"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "level_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# Right-clicking a pipe with an extractor places it on the clicked side.
[[injection]]
id = "right-click-block"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]

# `/moderndynamics info <x> <y> <z>`.
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]

id = "moderndynamics"
name = "Modern Dynamics"
version = "0.2.2"
description = """A port of Modern Dynamics for Horizon: the item pipe, its six-side connection
state and the extractor and attractor attachments. An extractor on one side of a pipe pulls up to
four items every forty ticks from the inventory on that side into the pipe network's other
inventories, nearest first; an attractor pulls from the network's other inventories into the
inventory on its own side. Fluid and energy pipes, the filter and inhibitor attachments, the wrench
and the attachment screen are not ported yet."""
authors = ["Technici4n", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: an integrated server belongs to the client
# installation, so a single-player world or a LAN host needs both. A dedicated server is "server".
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"). Modern Dynamics does register a block, an item and a block entity type, so here the
# field is also true.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
